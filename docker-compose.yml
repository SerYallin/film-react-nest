version: '3.9'

services:
  app-frontend:
    image: ghcr.io/seryallin/film-react-nest/frontend:latest
    ports:
      - "80:80"
    networks:
      - app-network
    volumes:
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - app-backend

  app-backend:
    image: ghcr.io/seryallin/film-react-nest/backend:latest
    #    ports:
    #      - "8081:3000"
    networks:
      - app-network
    volumes:
      - ./public://var/www/app/public
    depends_on:
      - db
    environment:
      - DB_DRIVER=${DB_DRIVER}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - LOGGER=${LOGGER}

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:6.20
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - app-network

volumes:
  db-data:
  pgadmin-data:
networks:
  app-network:
    driver: bridge